<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>提詞台</title>
<style>
  :root{
    --bg:#0B0D10; --panel:#14171C; --panel-2:#1B1F26; --line:#262B33;
    --amber:#E8A33D; --amber-dim:#8A662A; --text:#EDEFF2; --text-dim:#8B92A0; --text-faint:#565D69;
    --radius:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button, .switch, .cd-chip, .preset-chip, .slot-tab, h1, .eyebrow, .lbl, .val, .row-val, .small-note{
    -webkit-user-select:none; user-select:none;
  }
  textarea, input, select{ -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; touch-action:manipulation; }
  html,body{height:100%; margin:0; overscroll-behavior:none;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  }
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
  button{font-family:inherit; cursor:pointer;}
  input,textarea,select{font-family:inherit;}
  ::selection{background:var(--amber-dim);}
  #app{min-height:100vh; min-height:100dvh;}
 
  /* ---------- editor screen ---------- */
  .editor{padding:16px 16px 110px; max-width:640px; margin:0 auto;}
  .eyebrow{font-family:ui-monospace,monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--text-faint);}
  .head{display:flex; align-items:baseline; gap:10px; margin:4px 0 4px;}
  .logo-mark{width:9px; height:9px; background:var(--amber); border-radius:2px; box-shadow:0 0 8px var(--amber);}
  h1{font-size:22px; margin:0; font-weight:700;}
 
  /* live preview — always visible, updated by direct style writes (no re-render) */
  .preview-shell{
    margin-top:12px;
    border-radius:var(--radius); overflow:hidden; border:1px solid var(--line);
    box-shadow:0 12px 30px rgba(0,0,0,.4);
  }
  .preview-box{
    height:170px; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative;
  }
  .preview-mirror{width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
  #previewText{white-space:pre-wrap; text-align:center; padding:0 20px; word-break:break-word;}
  .preview-tag{
    position:absolute; top:8px; left:10px; font-family:ui-monospace,monospace; font-size:10px;
    letter-spacing:.1em; color:rgba(255,255,255,.4); text-transform:uppercase;
  }
  .preview-scrub{position:absolute; bottom:0; left:0; right:0; height:4px; background:rgba(255,255,255,.08);}
  .preview-scrub-fill{height:100%; width:38%; background:var(--amber); opacity:.7;}
 
  textarea#scriptInput{
    width:100%; height:150px; resize:vertical; line-height:1.7; font-size:16px; padding:14px; margin-top:14px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); color:var(--text);
    position:relative; z-index:1;
  }
  textarea#scriptInput:focus{outline:none; border-color:var(--amber-dim);}
 
  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:13px; margin-top:11px; isolation:isolate;}
  .card h3{margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim); font-weight:700; display:flex; align-items:center; gap:8px;}
  .card h3 .ic{color:var(--amber);}
 
  /* slider rows — the core "直觀滑動" control */
  .slide-field{margin-bottom:13px;}
  .slide-field:last-child{margin-bottom:0;}
  .slide-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px;}
  .slide-head .lbl{font-size:14px; color:var(--text);}
  .slide-head .val{font-family:ui-monospace,monospace; font-size:13px; color:var(--amber); font-weight:600; min-width:54px; text-align:right;}
  .slide-track-wrap{position:relative; height:36px; display:flex; align-items:center; isolation:isolate;}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:36px; background:transparent; margin:0; padding:0; position:relative; z-index:2;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:6px; border-radius:999px; background:linear-gradient(90deg, var(--amber) var(--fill,50%), #2a3038 var(--fill,50%));
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:26px; height:26px; border-radius:50%; background:#fff; margin-top:-10px;
    box-shadow:0 2px 8px rgba(0,0,0,.4), 0 0 0 4px rgba(232,163,61,.25);
    border:2px solid var(--amber);
  }
  input[type=range]::-moz-range-track{ height:6px; border-radius:999px; background:#2a3038; }
  input[type=range]::-moz-range-progress{ height:6px; border-radius:999px; background:var(--amber); }
  input[type=range]::-moz-range-thumb{
    width:22px; height:22px; border-radius:50%; background:#fff; border:2px solid var(--amber);
  }
 
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  select{width:100%; background:#0F1216; border:1px solid var(--line); color:var(--text); border-radius:8px; padding:10px; font-size:14px;}
  label.field{display:block;}
  .row-val{font-size:13px; color:var(--text-dim); margin-bottom:6px;}
  input[type=color]{width:100%; height:38px; border:1px solid var(--line); border-radius:8px; background:none; padding:0;}
 
  .switch-row{display:flex; align-items:center; justify-content:space-between;}
  .switch-row .lbl{font-size:14px;}
  .switch-row .lbl .desc{display:block; font-size:12px; color:var(--text-faint); margin-top:2px;}
  .switch{position:relative; width:46px; height:26px; background:#2a3038; border-radius:999px; border:1px solid var(--line); flex-shrink:0;}
  .switch.on{background:var(--amber-dim); border-color:var(--amber);}
  .switch .knob{position:absolute; top:2px; left:2px; width:20px; height:20px; background:#fff; border-radius:50%; transition:transform .15s ease;}
  .switch.on .knob{transform:translateX(20px);}
 
  .cd-row{display:flex; gap:8px; flex-wrap:wrap;}
  .cd-chip{padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--panel-2); color:var(--text-dim); font-size:13px;}
  .cd-chip.active{border-color:var(--amber); color:var(--amber); background:rgba(232,163,61,.1);}
 
  /* ---------- article tabs / presets ---------- */
  .slot-bar{display:flex; gap:8px; margin-top:14px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch;}
  .slot-tab{
    flex-shrink:0; display:flex; align-items:center; gap:8px; background:var(--panel-2); border:1px solid var(--line);
    border-radius:999px; padding:9px 8px 9px 14px; font-size:13px; color:var(--text-dim); white-space:nowrap;
  }
  .slot-tab.active{border-color:var(--amber); color:var(--amber); background:rgba(232,163,61,.1);}
  .slot-tab .slot-name{font-weight:600;}
  .slot-tab .slot-del{
    width:20px; height:20px; border-radius:50%; background:var(--panel); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--text-faint); flex-shrink:0;
  }
  .slot-add{
    flex-shrink:0; background:transparent; border:1px dashed var(--amber-dim); color:var(--amber); border-radius:999px;
    padding:9px 16px; font-size:13px; font-weight:600; white-space:nowrap;
  }
 
  .preset-row{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  .preset-chip{
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:12px 8px;
    display:flex; flex-direction:column; align-items:center; gap:6px; position:relative;
  }
  .preset-chip .pname{font-size:12px; font-weight:600; color:var(--text);}
  .preset-swatch{width:100%; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:ui-monospace,monospace; font-size:10px;}
  .preset-save{
    position:absolute; top:-8px; right:-8px; width:22px; height:22px; border-radius:50%;
    background:var(--panel); border:1px solid var(--line); color:var(--text-dim); font-size:11px; display:flex; align-items:center; justify-content:center;
  }
 
  .global-toast{
    position:fixed; top:calc(14px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    background:rgba(20,23,28,.96); border:1px solid var(--line); color:var(--text); font-size:13px;
    padding:9px 18px; border-radius:999px; z-index:100; opacity:0; pointer-events:none; transition:opacity .2s;
  }
  .global-toast.show{opacity:1;}

  /* custom in-page dialog — replaces window.prompt/alert, which some
     in-app browsers / embedded previews silently block */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:90; display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .18s; padding:20px;
  }
  .modal-overlay.show{opacity:1; pointer-events:auto;}
  .modal-box{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; width:100%; max-width:340px;
    transform:translateY(8px); transition:transform .18s;
  }
  .modal-overlay.show .modal-box{transform:translateY(0);}
  .modal-title{font-size:15px; font-weight:700; margin:0 0 12px;}
  .modal-box input[type=text]{
    width:100%; background:#0F1216; border:1px solid var(--line); color:var(--text); border-radius:8px;
    padding:11px 12px; font-size:16px; margin-bottom:14px;
  }
  .modal-box input[type=text]:focus{outline:none; border-color:var(--amber-dim);}
  .modal-actions{display:flex; gap:8px;}
  .modal-actions button{flex:1; border-radius:8px; padding:11px; font-size:14px; font-weight:600; border:1px solid var(--line);}
  .modal-cancel{background:var(--panel-2); color:var(--text-dim);}
  .modal-ok{background:var(--amber); color:#1A1300; border-color:var(--amber);}

  .kb-row{display:flex; justify-content:flex-end; margin-top:8px;}
  .kb-btn{
    background:var(--panel-2); border:1px solid var(--amber-dim); color:var(--amber); border-radius:8px;
    padding:8px 14px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px;
  }
  .kb-btn:active{transform:scale(.97);}
 
  .start-bar{
    position:fixed; left:0; right:0; bottom:0; padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, rgba(11,13,16,0), var(--bg) 30%);
    z-index:40;
  }
  .btn-start{
    width:100%; max-width:640px; margin:0 auto; display:block;
    background:var(--amber); color:#1A1300; border:none; border-radius:12px; padding:16px; font-size:16px; font-weight:700;
  }
  .btn-start:active{transform:scale(.98);}
  .small-note{font-size:12px; color:var(--text-faint); margin-top:10px; line-height:1.6;}
 
  /* ---------- play screen ---------- */
  .play-screen{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden; z-index:50;
  }
  .mirror-wrap{width:100%; height:100%; display:flex; align-items:flex-start; justify-content:center; overflow:hidden;}
  .scroll-text{white-space:pre-wrap; word-break:break-word; text-align:center; padding:0 24px; will-change:transform;}
  .seg-block{margin-bottom:1.3em;}
  .seg-block:last-child{margin-bottom:0;}
  .play-hud{
    position:fixed; top:0; left:0; right:0; padding:14px 16px calc(10px + env(safe-area-inset-top));
    display:flex; justify-content:space-between; align-items:center;
    background:linear-gradient(180deg, rgba(0,0,0,.55), transparent);
    opacity:0; transition:opacity .25s; pointer-events:none; z-index:5;
  }
  .play-hud.show{opacity:.25; pointer-events:auto;}
  .hud-btn{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:#fff; width:38px; height:38px; border-radius:10px; font-size:16px;}
  .progress-track{position:fixed; left:0; right:0; bottom:0; height:3px; background:rgba(255,255,255,.08); z-index:5;}
  .progress-fill{height:100%; background:var(--amber); width:0%;}
 
  .play-controls{
    position:fixed; bottom:0; left:0; right:0; padding:14px calc(10px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
    display:flex; align-items:center; gap:10px;
    background:linear-gradient(0deg, rgba(0,0,0,.65), transparent);
    opacity:0; transition:opacity .25s; pointer-events:none; z-index:5;
  }
  .play-controls.show{opacity:.25; pointer-events:auto;}
  .pc-btn{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); color:#fff; width:44px; height:44px; border-radius:10px; font-size:16px; flex-shrink:0;}
  .pc-spacer{flex:1;}
  .pc-play{background:var(--amber); color:#1A1300; border:none; width:56px; height:56px; border-radius:50%; font-size:18px; font-weight:700; flex-shrink:0;}
 
  /* bottom sheet — live drag sliders during playback */
  .sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:59; opacity:0; pointer-events:none; transition:opacity .2s;}
  .sheet-backdrop.show{opacity:1; pointer-events:auto;}
  .adjust-sheet{
    position:fixed; left:0; right:0; bottom:0; background:var(--panel); border-top:1px solid var(--line);
    border-radius:18px 18px 0 0; padding:10px 20px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.8,.2,1); z-index:60;
  }
  .adjust-sheet.show{transform:translateY(0);}
  .sheet-grip{width:36px; height:4px; background:var(--line); border-radius:999px; margin:6px auto 14px;}
  .sheet-row{margin-bottom:18px;}
  .sheet-row:last-child{margin-bottom:0;}
 
  .cd-overlay{position:fixed; inset:0; background:rgba(0,0,0,.92); display:flex; align-items:center; justify-content:center; z-index:70;}
  .cd-overlay .num{font-size:min(34vw,260px); font-weight:800; color:var(--amber); font-family:ui-monospace,monospace; line-height:1;}
  .clicker-toast{
    position:fixed; top:calc(14px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    background:rgba(232,163,61,.15); border:1px solid var(--amber-dim); color:var(--amber);
    font-size:12px; padding:6px 14px; border-radius:999px; z-index:65; opacity:0; transition:opacity .2s;
    font-family:ui-monospace,monospace; pointer-events:none;
  }
  .clicker-toast.show{opacity:1;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div id="app"></div>
 
<script>
/* ============================================================
   單機提詞台 — 專業優化版
   效能重點：捲動時不即時量測 DOM 高度（避免每影格觸發 reflow），
   只在內容／字體樣式變動時重新量測一次並快取。
   互動重點：所有數值調整都是拖曳滑桿即時生效，直接改 style，
   不整頁重繪，編輯區上方常駐即時預覽。
   ============================================================ */
 
const DEFAULTS = {
  script: "歡迎來到今天的活動。\n\n請大家找到自己的座位，我們即將開始。\n\n首先，讓我們歡迎今天的主持人上台。",
  fontSize: 44,
  fontWeight: 500,
  lineHeight: 1.6,
  fontFamily: "sans",
  color: "#EDEFF2",
  bg: "#000000",
  mirror: false,
  speed: 40,
  countdownSec: 0,
  autoLoop: true,
  autoResumeAfterLoop: false
};
 
let cfg = Object.assign({}, DEFAULTS);
let view = 'editor';
let isPlaying = false;
let scrollOffset = 0;
let lastFrame = null;
let rafId = null;
let hudTimer = null;
let countdownRemaining = 0;
let countdownTimer = null;
let clickerToastTimer = null;
let cachedMaxScroll = 0;     // recomputed only when content/style changes, not per-frame
let needsRemeasure = true;
 
// multiple script "slots" (tabs) — one per speaker/article. Switching
// tabs just swaps which slot's text is shown; every slot auto-saves to
// this browser's localStorage as you type, no explicit save step.
function genId(){ return 's_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
let slots = [ { id: genId(), name: '文章 1', script: DEFAULTS.script } ];
let activeSlotId = slots[0].id;

const LS_SLOTS = 'tp_slots_v1';
const LS_PRESETS = 'tp_presets_v1';
const LS_CFG = 'tp_cfg_v1'; // persists display/playback settings (incl. mirror) across reloads
let draftTimer = null;

function persistSlots(){ try{ localStorage.setItem(LS_SLOTS, JSON.stringify({ slots, activeSlotId })); }catch(err){ console.warn('save failed', err); } }
function persistPresets(){ try{ localStorage.setItem(LS_PRESETS, JSON.stringify(presets)); }catch(err){ console.warn('save failed', err); } }
// NOTE: previously only the script text was saved to localStorage — every other
// setting (fontSize/speed/mirror/...) lived only in memory and silently reset
// back to DEFAULTS (mirror:false) on every page reload. That's why "鏡像反轉"
// could look like it was on while editing, but the actual recording/glass
// setup showed unmirrored text again — the toggle never survived a reload.
function persistCfg(){
  try{
    const { script, ...rest } = cfg; // script is saved per-slot separately
    localStorage.setItem(LS_CFG, JSON.stringify(rest));
  }catch(err){ console.warn('save failed', err); }
}
function loadFromStorage(){
  try{
    const raw = localStorage.getItem(LS_SLOTS);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.slots) && parsed.slots.length){
        slots = parsed.slots;
        activeSlotId = parsed.activeSlotId && slots.some(s=>s.id===parsed.activeSlotId) ? parsed.activeSlotId : slots[0].id;
      }
    }
  }catch(err){}
  try{ const pr = localStorage.getItem(LS_PRESETS); if(pr){ const parsed = JSON.parse(pr); if(Array.isArray(parsed) && parsed.length) presets = parsed; } }catch(err){}
  try{
    const cr = localStorage.getItem(LS_CFG);
    if(cr){
      const parsed = JSON.parse(cr);
      if(parsed && typeof parsed === 'object') Object.assign(cfg, parsed);
    }
  }catch(err){}
  const active = slots.find(s=>s.id===activeSlotId) || slots[0];
  cfg.script = active.script;
}
function getActiveSlot(){ return slots.find(s=>s.id===activeSlotId) || slots[0]; }
function syncActiveSlotScript(){
  const ta = document.getElementById('scriptInput');
  if(ta) cfg.script = ta.value;
  const slot = getActiveSlot();
  if(slot) slot.script = cfg.script;
}
function switchSlot(id){
  syncActiveSlotScript();
  persistSlots();
  activeSlotId = id;
  cfg.script = getActiveSlot().script;
  renderEditor();
}
function addSlot(){
  syncActiveSlotScript();
  const n = { id: genId(), name: '文章 '+(slots.length+1), script: '' };
  slots.push(n);
  activeSlotId = n.id;
  cfg.script = '';
  persistSlots();
  renderEditor();
}
function renameSlot(id){
  const slot = slots.find(s=>s.id===id);
  if(!slot) return;
  openTextModal('這篇文章要叫什麼名字？', slot.name, (name)=>{
    if(name === null || name === undefined) return;
    slot.name = name.trim() || slot.name;
    persistSlots();
    renderEditor();
  });
}
function deleteSlot(id){
  if(slots.length <= 1) return; // always keep at least one slot
  slots = slots.filter(s=>s.id!==id);
  if(activeSlotId === id){
    activeSlotId = slots[0].id;
    cfg.script = slots[0].script;
  }
  persistSlots();
  renderEditor();
}
 
// three quick-apply style presets
let presets = [
  { name:'標準',     fontSize:44, fontWeight:500, lineHeight:1.6, fontFamily:'sans', color:'#EDEFF2', bg:'#000000', mirror:false, speed:40 },
  { name:'舞台大字', fontSize:64, fontWeight:700, lineHeight:1.5, fontFamily:'sans', color:'#F5C242', bg:'#000000', mirror:false, speed:30 },
  { name:'鏡像提詞', fontSize:50, fontWeight:600, lineHeight:1.6, fontFamily:'sans', color:'#EDEFF2', bg:'#000000', mirror:true,  speed:45 }
];
 
const app = document.getElementById('app');
const FONT_STACKS = {
  sans: `-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif`,
  serif: `"Noto Serif TC","Songti TC","PMingLiU",serif`,
  mono: `ui-monospace,"SF Mono",Menlo,Consolas,monospace`
};
function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fontStack(){ return FONT_STACKS[cfg.fontFamily] || FONT_STACKS.sans; }
function sliderFillPct(el){ return ((el.value-el.min)/(el.max-el.min))*100; }
function paintTrack(el){ el.style.setProperty('--fill', sliderFillPct(el)+'%'); }
 
function toast(msg){
  let el = document.getElementById('globalToast');
  if(!el){
    el = document.createElement('div');
    el.id = 'globalToast';
    el.className = 'global-toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=> el.classList.remove('show'), 1600);
}

/* ---------------- custom text-input dialog ----------------
   Replaces window.prompt(): some in-app browsers / embedded preview
   panes (including some chat-app file previews) block native
   alert/confirm/prompt dialogs and the keyboard tied to them without
   any visible error. This dialog is plain page content, so it always
   works, and its input is a real <input> the keyboard will open for. */
function openTextModal(title, defaultValue, onConfirm){
  let ov = document.getElementById('modalOverlay');
  if(!ov){
    ov = document.createElement('div');
    ov.id = 'modalOverlay';
    ov.className = 'modal-overlay';
    ov.innerHTML = `
      <div class="modal-box">
        <p class="modal-title" id="modalTitle"></p>
        <input type="text" id="modalInput" autocomplete="off">
        <div class="modal-actions">
          <button class="modal-cancel" id="modalCancel">取消</button>
          <button class="modal-ok" id="modalOk">確定</button>
        </div>
      </div>`;
    document.body.appendChild(ov);
  }
  document.getElementById('modalTitle').textContent = title;
  const input = document.getElementById('modalInput');
  input.value = defaultValue || '';
  ov.classList.add('show');
  setTimeout(()=>{ input.focus(); input.select(); }, 60);
  const close = ()=>{ ov.classList.remove('show'); input.removeEventListener('keydown', onKey); };
  const onKey = (e)=>{ if(e.key==='Enter'){ confirm(); } if(e.key==='Escape'){ close(); } };
  const confirm = ()=>{ const v = input.value; close(); onConfirm(v); };
  input.addEventListener('keydown', onKey);
  document.getElementById('modalOk').onclick = confirm;
  document.getElementById('modalCancel').onclick = close;
}

function firstLine(script){
  const seg = script.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean)[0] || script;
  return seg.length > 120 ? seg.slice(0,120)+'…' : seg;
}
 
function wireEditorEvents(){
  let t;
  const scriptEl = document.getElementById('scriptInput');
  scriptEl.addEventListener('input', e=>{
    cfg.script = e.target.value;
    clearTimeout(t);
    t = setTimeout(()=>{
      document.getElementById('previewText').textContent = firstLine(cfg.script);
      needsRemeasure = true;
    }, 120);
  });

  /* "叫出鍵盤" — best-effort. Chrome/Android exposes a VirtualKeyboard
     API that can force the on-screen keyboard open even while a
     Bluetooth HID device (e.g. a presenter clicker) is connected.
     iOS gives web pages no such control — Safari always hides the
     software keyboard while it thinks a hardware keyboard is present,
     so on iPhone this button can only re-focus the field and the
     remote still needs to be disconnected first. */
  document.getElementById('kbBtn').addEventListener('click', ()=>{
    const ta = document.getElementById('scriptInput');

        forced = true;

    }

  const editorEl = document.querySelector('.editor');
  const scheduleDraft = ()=>{

/* ================= PLAY ================= */
let segments = [];
let segmentOffsets = [];
let currentSegmentIndex = 0;
let jumpAnim = null;      // {from,to,start,dur}
let loopRunning = false;
 
function splitSegments(text){
  const parts = text.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  return parts.length ? parts : [text.trim() || ' '];
}
function buildSegHTML(){
  segments = splitSegments(cfg.script);
  return segments.map(s=>`<div class="seg-block">${escapeHtml(s)}</div>`).join('');
}
 
/* simple re-entrancy guard so double taps / rapid button mashing can't
   start two overlapping playback flows (this was the main cause of the
   freeze-on-start/stop reported earlier) */
function onceEvery(fn, ms){
  let last = 0;
  return (...args)=>{
    const now = Date.now();
    if(now - last < ms) return;
    last = now;
    try{ fn(...args); }catch(err){ console.error('action failed', err); }
  };
}
 
function beginPlay(){
  syncActiveSlotScript();
  persistSlots();
  scrollOffset = 0; isPlaying = false; needsRemeasure = true;
  currentSegmentIndex = 0; jumpAnim = null;
  if(cfg.countdownSec > 0){ startCountdown(cfg.countdownSec); }
  else{ enterPlayView(); }
}
function startCountdown(sec){
  countdownRemaining = sec;
  view = 'countdown';
  renderPlayShell();
  const overlay = document.createElement('div');
  overlay.className = 'cd-overlay';
  overlay.innerHTML = `<div class="num mono" id="cdNum">${countdownRemaining}</div>`;
  document.body.appendChild(overlay);
  countdownTimer = setInterval(()=>{
    countdownRemaining--;
    const el = document.getElementById('cdNum');
    if(el) el.textContent = countdownRemaining;
    if(countdownRemaining <= 0){
      clearInterval(countdownTimer);
      overlay.remove();
      isPlaying = true;
      view = 'play';
      updateHUDVisibility(true);
      ensureLoopRunning();
      requestAnimationFrame(()=>{ window.scrollTo(0,1); setTimeout(()=>window.scrollTo(0,1),300); });
    }
  }, 1000);
}

  requestAnimationFrame(()=>{ window.scrollTo(0,1); setTimeout(()=>window.scrollTo(0,1),300); });

  isPlaying = !isPlaying;
  lastFrame = null;
  updateStatusLabel();
  const btn = document.getElementById('pcPlay'); if(btn) btn.textContent = isPlaying?'⏸':'▶';
  if(isPlaying){

  }else{
    clearTimeout(hudTimer);
    updateHUDVisibility(true, true); // paused → stay visible until played again
  }

function jumpToSegment(idx){
  if(idx === currentSegmentIndex && jumpAnim === null) return; // already there, skip a no-op jump
  if(!segmentOffsets.length) return;
  idx = Math.max(0, Math.min(segmentOffsets.length-1, idx));
  currentSegmentIndex = idx;
  const target = Math.min(segmentOffsets[idx], cachedMaxScroll || segmentOffsets[idx]);
  // longer animation for longer distances so a big paragraph jump still
  // reads as a smooth glide instead of a hard cut, capped so it never
  // feels sluggish either
  const dist = Math.abs(target - scrollOffset);
  const dur = Math.min(700, Math.max(280, dist * 0.7));
  jumpAnim = { from: scrollOffset, to: target, start: null, dur };
  updateSegLabel();
  ensureLoopRunning();
  resetHudAutoHide();
}
// fixed-size step (~2 lines), used by the prev/next buttons and remote —
// unlike jumping to the next paragraph boundary, this always moves the
// same distance whether the paragraph is one line or ten
function jumpByLines(direction, lines){
  if(needsRemeasure) remeasure();
  const lineHeightPx = cfg.fontSize * cfg.lineHeight;
  const step = lineHeightPx * (lines || 2);
  const target = Math.max(0, Math.min(cachedMaxScroll, scrollOffset + direction*step));
  const dist = Math.abs(target - scrollOffset);
  const dur = Math.min(420, Math.max(180, dist * 0.9));
  jumpAnim = { from: scrollOffset, to: target, start: null, dur };
  ensureLoopRunning();
  resetHudAutoHide();
  resetHudAutoHide();
}
function toggleFullscreen(){
  const el = document.getElementById('playScreen');
  if(document.fullscreenElement){
    document.exitFullscreen().catch(()=>{});
  }else{
    // real Fullscreen API where the browser supports it (most Android browsers)
    if(el.requestFullscreen){ el.requestFullscreen().catch(()=>{}); }
    // iOS Safari has no Fullscreen API for on-page elements, so as a
    // fallback (and as a harmless extra on every platform) nudge the
    // page to scroll past the address bar, which makes mobile browsers
    // collapse their own toolbar and hand back that strip of height
    requestAnimationFrame(()=>{ window.scrollTo(0,1); setTimeout(()=>window.scrollTo(0,1),300); });
  }
}
function updateStatusLabel(){
  const el = document.getElementById('statusLabel');
  if(el) el.textContent = isPlaying ? '播放中' : '已暫停';
}
function updateSegLabel(){
  const el = document.getElementById('segLabel');
  if(el) el.textContent = `${currentSegmentIndex+1} / ${Math.max(1,segments.length)}`;
}
const DRAG_MULTIPLIER = 1.5;
let dragState = null;
let justDragged = false;
let momentum = null; // {v: pixels of scrollOffset per ms} — inertia after a flick
function attachSwipeHandlers(el){
  el.addEventListener('touchstart', e=>{
    if(e.target.closest('.play-hud, .play-controls, .adjust-sheet')){ dragState=null; return; }
    if(needsRemeasure) remeasure();
    momentum = null; // grabbing the screen always cancels any inertia in progress
    const tt = e.touches[0];
    const now = performance.now();
    dragState = { startY: tt.clientY, startX: tt.clientX, startScroll: scrollOffset, moved: false,
                  lastY: tt.clientY, lastT: now, vel: 0 };
    jumpAnim = null; // manual touch always takes over any in-flight jump animation
  }, {passive:true});

  el.addEventListener('touchmove', e=>{
    if(!dragState) return;
    const tt = e.touches[0];
    const dy = tt.clientY - dragState.startY;
    const dx = tt.clientX - dragState.startX;
    if(!dragState.moved){
      if(Math.abs(dy) < 6 && Math.abs(dx) < 6) return; // ignore tiny jitter so plain taps still work
      dragState.moved = true;
      if(isPlaying){
        isPlaying = false;
        updateStatusLabel();
        const btn = document.getElementById('pcPlay'); if(btn) btn.textContent = '▶';
      }
      clearTimeout(hudTimer);
      updateHUDVisibility(true, true); // finger is in control → keep controls visible, no auto-fade
    }
    // 1:1.5 tracking while the finger is down — moves 1.5x further than
    // the finger so you don't have to drag as far to cover the text
    scrollOffset = Math.max(0, Math.min(cachedMaxScroll, dragState.startScroll - dy*DRAG_MULTIPLIER));
    renderScrollPosition();
    // track instantaneous speed (smoothed) so a flick can carry momentum
    // into the release, the way native app lists do
    const now = performance.now();
    const dt = now - dragState.lastT;
    if(dt > 4){
      const instVel = -(tt.clientY - dragState.lastY) * DRAG_MULTIPLIER / dt;
      dragState.vel = dragState.vel*0.7 + instVel*0.3; // light smoothing
      dragState.lastY = tt.clientY;
      dragState.lastT = now;
    }
    e.preventDefault();
  }, {passive:false});

  el.addEventListener('touchend', ()=>{
    if(dragState && dragState.moved){
      justDragged = true;
      setTimeout(()=>{ justDragged = false; }, 350);
      // hand off to inertia if the release was a real flick, so the
      // screen keeps gliding and eases to a stop like a native app
      if(Math.abs(dragState.vel) > 0.04){
        momentum = { v: dragState.vel };
        ensureLoopRunning();
      }
    }
    dragState = null;
  });
}
function onScreenTap(e){
  if(justDragged) return; // this click is the tail end of a drag, not a real tap
  if(e.target.closest('.play-hud') || e.target.closest('.play-controls') || e.target.closest('.adjust-sheet')) return;
  if(document.getElementById('adjustSheet').classList.contains('show')){ toggleSheet(false); return; }
  togglePlay();
}
function updateHUDVisibility(show, keepOpen){
  const hud = document.getElementById('playHud');
  const ctl = document.getElementById('playControls');
  if(!hud || !ctl) return;
  if(show){
    hud.classList.add('show'); ctl.classList.add('show');
    if(!keepOpen) resetHudAutoHide();
  }else{
    hud.classList.remove('show'); ctl.classList.remove('show');
  }
}
function resetHudAutoHide(){
  clearTimeout(hudTimer);
  if(!isPlaying) return; // paused → controls stay put, no auto-fade
  hudTimer = setTimeout(()=>{
    const sheetEl = document.getElementById('adjustSheet');
    const sheetOpen = sheetEl && sheetEl.classList.contains('show');
    if(!sheetOpen && isPlaying){
      const hud = document.getElementById('playHud'); const ctl = document.getElementById('playControls');
      if(hud) hud.classList.remove('show'); if(ctl) ctl.classList.remove('show');
    }
  }, 1200); // fades out quickly once scrolling starts so it doesn't block the view
}
function showClickerToast(msg){
  const el = document.getElementById('clickerToast');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(clickerToastTimer);
  clickerToastTimer = setTimeout(()=> el.classList.remove('show'), 1100);
}
 
/* ---------------- scroll animation loop ----------------
   Perf + stability notes:
   - Height is measured once per content/style change (cached), never
     every frame — the earlier version re-measured every frame which
     forced a layout reflow 60x/sec and was the main cause of lag.
   - The loop only runs while actually needed (playing or mid-jump) and
     stops itself otherwise, instead of looping forever in the
     background — this avoids the runaway-CPU/"page unresponsive"
     freezes on long sessions.
   - The whole per-frame body is wrapped in try/catch and the next
     frame is always scheduled from a finally-equivalent path, so one
     transient error (e.g. a DOM node not ready yet) can no longer
     permanently kill the loop and leave the screen frozen.
------------------------------------------------------------ */
function remeasure(){
  const textEl = document.getElementById('scrollText');
  const wrapEl = document.getElementById('mirrorWrap');
  if(!textEl || !wrapEl) return;
  cachedMaxScroll = Math.max(0, textEl.scrollHeight - wrapEl.clientHeight + wrapEl.clientHeight*0.6);
  segmentOffsets = Array.from(textEl.querySelectorAll('.seg-block')).map(el=>el.offsetTop);
  needsRemeasure = false;
}
window.addEventListener('resize', ()=>{ needsRemeasure = true; ensureLoopRunning(); });
 
function ensureLoopRunning(){
  if(loopRunning) return;
  loopRunning = true;
  lastFrame = null;
  rafId = requestAnimationFrame(step);
}
function renderScrollPosition(){
  const textEl = document.getElementById('scrollText');
  const wrapEl = document.getElementById('mirrorWrap');
  if(!textEl || !wrapEl) return;
  textEl.style.transform = `translateY(${wrapEl.clientHeight*0.5 - scrollOffset}px)`;
  const fill = document.getElementById('progressFill');
  if(fill) fill.style.width = (cachedMaxScroll>0 ? Math.min(100, scrollOffset/cachedMaxScroll*100) : 0) + '%';
  if(segmentOffsets.length){
    let idx = 0;
    for(let i=0;i<segmentOffsets.length;i++){ if(segmentOffsets[i] <= scrollOffset+2) idx=i; }
    if(idx !== currentSegmentIndex){ currentSegmentIndex = idx; updateSegLabel(); }
  }
}
function step(t){
  if(view !== 'play'){ loopRunning = false; return; }
  let keepGoing = isPlaying || !!jumpAnim || !!momentum;
  try{
    if(needsRemeasure) remeasure();
    if(jumpAnim){
      if(jumpAnim.start == null) jumpAnim.start = t;
      const p = Math.min(1, (t - jumpAnim.start) / jumpAnim.dur);
      const eased = 1 - Math.pow(1-p, 3);
      scrollOffset = jumpAnim.from + (jumpAnim.to - jumpAnim.from) * eased;
      if(p >= 1){ jumpAnim = null; keepGoing = isPlaying || !!momentum; }
    }else if(momentum){
      if(momentum.lastT == null) momentum.lastT = t;
      const dtMs = t - momentum.lastT;
      momentum.lastT = t;
      scrollOffset += momentum.v * dtMs;
      momentum.v *= Math.pow(0.94, dtMs/8); // friction — glides then eases to a stop
      if(scrollOffset <= 0 || scrollOffset >= cachedMaxScroll || Math.abs(momentum.v) < 0.015){
        scrollOffset = Math.max(0, Math.min(cachedMaxScroll, scrollOffset));
        momentum = null;
        keepGoing = isPlaying;
      }
    }else if(isPlaying){
      if(lastFrame == null) lastFrame = t;
      const dt = (t - lastFrame) / 1000;
      lastFrame = t;
      scrollOffset += cfg.speed * dt;
      if(scrollOffset >= cachedMaxScroll){
        scrollOffset = cachedMaxScroll;
        if(cfg.autoLoop){
          isPlaying = false; keepGoing = true; // keep loop alive briefly to animate the rewind
          const btn = document.getElementById('pcPlay'); if(btn) btn.textContent='▶';
          updateStatusLabel();
          jumpAnim = { from: scrollOffset, to: 0, start: null, dur: 550 };
          currentSegmentIndex = 0; updateSegLabel();
        }else{
          isPlaying = false; keepGoing = false;
          const btn = document.getElementById('pcPlay'); if(btn) btn.textContent='▶';
          updateStatusLabel();
        }
      }
    }
    renderScrollPosition();
  }catch(err){
    console.error('teleprompter loop error (recovered):', err);
  }
  if(keepGoing){ rafId = requestAnimationFrame(step); }
  else{ loopRunning = false; }
}
 
/* ---------------- physical clicker (keyboard) support ---------------- */
let speedHoldTimer = null;
function adjustSpeed(delta){
  cfg.speed = Math.max(8, Math.min(300, cfg.speed+delta));
  showClickerToast('速度 '+cfg.speed+' px/s');
  const pv = document.getElementById('pValSpeed'), ps = document.getElementById('pSpeed');
  if(pv) pv.textContent = cfg.speed+' px/s';
  if(ps){ ps.value = cfg.speed; paintTrack(ps); }
  persistCfg();
}
window.addEventListener('keydown', (e)=>{
  if(view !== 'play' && view !== 'countdown') return;
  const k = e.key;
  if(k === 'ArrowUp' || k === 'PageUp'){
    if(!e.repeat){ jumpByLines(-1); showClickerToast('上一段'); }
    e.preventDefault(); return;
  }
  if(k === 'ArrowDown' || k === 'PageDown'){
    if(!e.repeat){ jumpByLines(1); showClickerToast('下一段'); }
    e.preventDefault(); return;
  }
  if(k === 'ArrowRight' || k === '+' || k === '='){
    e.preventDefault();
    if(!e.repeat && !speedHoldTimer){
      adjustSpeed(10);
      speedHoldTimer = setInterval(()=>adjustSpeed(10), 130); // held down → keeps climbing until keyup
    }
    return;
  }
  if(k === 'ArrowLeft' || k === '-'){
    e.preventDefault();
    if(!e.repeat && !speedHoldTimer){
      adjustSpeed(-10);
      speedHoldTimer = setInterval(()=>adjustSpeed(-10), 130);
    }
    return;
  }
  if(k === 'Escape'){ exitPlay(); return; }
  if(view === 'play'){
    togglePlay();
    showClickerToast('簡報器：' + (isPlaying ? '繼續播放' : '暫停'));
    e.preventDefault();
  }
});
window.addEventListener('keyup', (e)=>{
  if(['ArrowRight','ArrowLeft','+','=','-'].includes(e.key) && speedHoldTimer){
    clearInterval(speedHoldTimer);
    speedHoldTimer = null;
  }
});
 
loadFromStorage();
renderEditor();
</script>
